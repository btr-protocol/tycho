[package]
name = "ethereum-pancakeswap-v3"
version = "0.2.0"
edition = "2021"

[lib]
name = "ethereum_pancakeswap_v3"
crate-type = ["cdylib"]

[dependencies]
substreams = "0.5.22"
substreams-ethereum = "0.9.9"
prost = "0.11"
ethabi = "18.0.0"
anyhow = "1.0.75"
substreams-helper = { path = "../crates/substreams-helper" }
tycho-substreams = { path = "../crates/tycho-substreams" }
num-bigint = "0.4.4"
hex = "0.4.3"
itertools = "0.13.0"
serde = { version = "1.0.204", features = ["derive"] }
serde_qs = "0.13.0"

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[build-dependencies]
anyhow = "1.0.75"
substreams-ethereum = "0.9.9"

[dev-dependencies]
serde_json = "1.0.120"
