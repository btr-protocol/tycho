specVersion: v0.1.0
package:
  name: "base_pancakeswap_v3"
  version: v0.2.0
  url: "https://github.com/propeller-heads/tycho-protocol-sdk/tree/main/substreams/ethereum-pancakeswap-v3"

protobuf:
  files:
    - tycho/evm/v1/common.proto
    - tycho/evm/v1/utils.proto
    - pancakeswap.proto
  importPaths:
    - ./proto/v1
    - ../../../proto/

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/ethereum_pancakeswap_v3.wasm

modules:
  - name: map_snapshot_0
    kind: map
    initialBlock: 2912007
    inputs:
      - params: string
      - source: sf.substreams.v1.Clock
    output:
      type: proto:pancakeswap.v3.SnapshotPools

  - name: map_snapshot_1
    kind: map
    initialBlock: 2912007
    inputs:
      - params: string
      - source: sf.substreams.v1.Clock
    output:
      type: proto:pancakeswap.v3.SnapshotPools

  - name: map_snapshot_2
    kind: map
    initialBlock: 2912007
    inputs:
      - params: string
      - source: sf.substreams.v1.Clock
    output:
      type: proto:pancakeswap.v3.SnapshotPools

  - name: map_snapshot_3
    kind: map
    initialBlock: 2912007
    inputs:
      - params: string
      - source: sf.substreams.v1.Clock
    output:
      type: proto:pancakeswap.v3.SnapshotPools

  - name: map_snapshot_4
    kind: map
    initialBlock: 2912007
    inputs:
      - params: string
      - source: sf.substreams.v1.Clock
    output:
      type: proto:pancakeswap.v3.SnapshotPools

  - name: map_snapshot_5
    kind: map
    initialBlock: 2912007
    inputs:
      - params: string
      - source: sf.substreams.v1.Clock
    output:
      type: proto:pancakeswap.v3.SnapshotPools

  - name: map_snapshot_6
    kind: map
    initialBlock: 2912007
    inputs:
      - params: string
      - source: sf.substreams.v1.Clock
    output:
      type: proto:pancakeswap.v3.SnapshotPools

  - name: map_snapshot_7
    kind: map
    initialBlock: 2912007
    inputs:
      - params: string
      - source: sf.substreams.v1.Clock
    output:
      type: proto:pancakeswap.v3.SnapshotPools

  - name: map_snapshot
    kind: map
    initialBlock: 2912007
    inputs:
      - map: map_snapshot_0
      - map: map_snapshot_1
      - map: map_snapshot_2
      - map: map_snapshot_3
      - map: map_snapshot_4
      - map: map_snapshot_5
      - map: map_snapshot_6
      - map: map_snapshot_7
    output:
      type: proto:pancakeswap.v3.SnapshotPools

  - name: map_pools_created
    kind: map
    initialBlock: 2912007
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:tycho.evm.v1.BlockChanges

  - name: store_pools
    kind: store
    initialBlock: 2912007
    updatePolicy: set_if_not_exists
    valueType: proto:pancakeswap.v3.Pool
    inputs:
      - map: map_snapshot
      - map: map_pools_created

  - name: map_events
    kind: map
    initialBlock: 2912007
    inputs:
      - source: sf.ethereum.type.v2.Block
      - store: store_pools
    output:
      type: proto:pancakeswap.v3.Events

  - name: map_balance_changes
    kind: map
    initialBlock: 2912007
    inputs:
      - map: map_events
    output:
      type: proto:tycho.evm.v1.BlockBalanceDeltas

  - name: map_ticks_changes
    kind: map
    initialBlock: 2912007
    inputs:
      - map: map_events
    output:
      type: proto:pancakeswap.v3.TickDeltas

  - name: store_pool_current_tick
    kind: store
    initialBlock: 2912007
    updatePolicy: set
    valueType: int64
    inputs:
      - map: map_snapshot
      - map: map_events

  - name: map_liquidity_changes
    kind: map
    initialBlock: 2912007
    inputs:
      - map: map_events
      - store: store_pool_current_tick
    output:
      type: proto:pancakeswap.v3.LiquidityChanges

  - name: map_protocol_changes
    kind: map
    initialBlock: 2912007
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - map: map_pools_created
      - map: map_events
      - map: map_balance_changes
      - map: map_ticks_changes
      - map: map_liquidity_changes
    output:
      type: proto:tycho.evm.v1.BlockChanges

params:
  map_snapshot_0: ""
  map_snapshot_1: ""
  map_snapshot_2: ""
  map_snapshot_3: ""
  map_snapshot_4: ""
  map_snapshot_5: ""
  map_snapshot_6: ""
  map_snapshot_7: ""
  map_pools_created: "factory_address=0BFbCF9fa4f9C56B0F40a671Ad40E0805A091865&protocol_type_name=pancakeswap_v3_pool"
