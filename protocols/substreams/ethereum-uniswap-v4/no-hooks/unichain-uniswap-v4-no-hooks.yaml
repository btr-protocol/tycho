specVersion: v0.1.0
package:
  name: "unichain_uniswap_v4"
  version: v0.5.0
  url: "https://github.com/propeller-heads/tycho-protocol-sdk/tree/main/substreams/ethereum-uniswap-v4/no-hooks"

protobuf:
  files:
    - tycho/evm/v1/entity.proto
    - tycho/evm/v1/common.proto
    - tycho/evm/v1/utils.proto
    - uniswap.proto
  importPaths:
    - ../../../../proto
    - ../shared/proto
  excludePaths:
    - sf/substreams
    - google
    - tycho

binaries:
  default:
    type: wasm/rust-v1
    file: ..//target/wasm32-unknown-unknown/release/ethereum_uniswap_v4_no_hooks.wasm

modules:
  - name: map_snapshot_0
    kind: map
    initialBlock: 0
    inputs:
      - params: string
      - source: sf.substreams.v1.Clock
    output:
      type: proto:uniswap.v4.SnapshotPools

  - name: map_snapshot_1
    kind: map
    initialBlock: 0
    inputs:
      - params: string
      - source: sf.substreams.v1.Clock
    output:
      type: proto:uniswap.v4.SnapshotPools

  - name: map_snapshot_2
    kind: map
    initialBlock: 0
    inputs:
      - params: string
      - source: sf.substreams.v1.Clock
    output:
      type: proto:uniswap.v4.SnapshotPools

  - name: map_snapshot_3
    kind: map
    initialBlock: 0
    inputs:
      - params: string
      - source: sf.substreams.v1.Clock
    output:
      type: proto:uniswap.v4.SnapshotPools

  - name: map_snapshot_4
    kind: map
    initialBlock: 0
    inputs:
      - params: string
      - source: sf.substreams.v1.Clock
    output:
      type: proto:uniswap.v4.SnapshotPools

  - name: map_snapshot_5
    kind: map
    initialBlock: 0
    inputs:
      - params: string
      - source: sf.substreams.v1.Clock
    output:
      type: proto:uniswap.v4.SnapshotPools

  - name: map_snapshot_6
    kind: map
    initialBlock: 0
    inputs:
      - params: string
      - source: sf.substreams.v1.Clock
    output:
      type: proto:uniswap.v4.SnapshotPools

  - name: map_snapshot_7
    kind: map
    initialBlock: 0
    inputs:
      - params: string
      - source: sf.substreams.v1.Clock
    output:
      type: proto:uniswap.v4.SnapshotPools

  - name: map_snapshot
    kind: map
    initialBlock: 0
    inputs:
      - map: map_snapshot_0
      - map: map_snapshot_1
      - map: map_snapshot_2
      - map: map_snapshot_3
      - map: map_snapshot_4
      - map: map_snapshot_5
      - map: map_snapshot_6
      - map: map_snapshot_7
    output:
      type: proto:uniswap.v4.SnapshotPools

  - name: map_pools_created
    kind: map
    initialBlock: 0
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:tycho.evm.v1.BlockEntityChanges

  - name: store_pools
    kind: store
    initialBlock: 0
    updatePolicy: set_if_not_exists
    valueType: proto:uniswap.v4.Pool
    inputs:
      - map: map_snapshot
      - map: map_pools_created

  - name: map_events
    kind: map
    initialBlock: 0
    inputs:
      - source: sf.ethereum.type.v2.Block
      - store: store_pools
    output:
      type: proto:uniswap.v4.Events

  - name: store_pool_current_tick
    kind: store
    initialBlock: 0
    updatePolicy: set
    valueType: int64
    inputs:
      - map: map_snapshot
      - map: map_events

  - name: store_pool_current_sqrt_price
    kind: store
    initialBlock: 0
    updatePolicy: set
    valueType: bigint
    inputs:
      - map: map_snapshot
      - map: map_events

  - name: map_balance_changes
    kind: map
    initialBlock: 0
    inputs:
      - map: map_events
      - store: store_pool_current_sqrt_price
    output:
      type: proto:tycho.evm.v1.BlockBalanceDeltas

  - name: map_ticks_changes
    kind: map
    initialBlock: 0
    inputs:
      - map: map_events
    output:
      type: proto:uniswap.v4.TickDeltas

  - name: map_liquidity_changes
    kind: map
    initialBlock: 0
    inputs:
      - map: map_events
      - store: store_pool_current_tick
    output:
      type: proto:uniswap.v4.LiquidityChanges

  - name: map_protocol_changes
    kind: map
    initialBlock: 0
    inputs:
      - source: sf.ethereum.type.v2.Block
      - map: map_pools_created
      - map: map_events
      - map: map_balance_changes
      - map: map_ticks_changes
      - map: map_liquidity_changes
    output:
      type: proto:tycho.evm.v1.BlockChanges

params:
  map_snapshot_0: ""
  map_snapshot_1: ""
  map_snapshot_2: ""
  map_snapshot_3: ""
  map_snapshot_4: ""
  map_snapshot_5: ""
  map_snapshot_6: ""
  map_snapshot_7: ""
  map_pools_created: "1F98400000000000000000000000000000000004"
