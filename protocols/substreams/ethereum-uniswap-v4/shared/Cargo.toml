[package]
name = "ethereum-uniswap-v4-shared"
version = "0.6.0"
edition = "2021"

[lib]
name = "ethereum_uniswap_v4_shared"
crate-type = ["rlib"]

[dependencies]
substreams = "0.5.22"
substreams-ethereum = "0.9.9"
prost = "0.11"
ethabi = "18.0.0"
anyhow = "1.0.75"
substreams-helper = { path = "../../crates/substreams-helper" }
tycho-substreams = { path = "../../crates/tycho-substreams" }
num-bigint = "0.4.4"
hex = "0.4.3"
itertools = "0.13.0"

[dev-dependencies]
rstest = "0.24.0"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0.120"

[target.wasm32-unknown-unknown.dependencies]
getrandom = { version = "0.2", features = ["custom"] }

[build-dependencies]
anyhow = "1.0.75"
substreams-ethereum = "0.9.9"
