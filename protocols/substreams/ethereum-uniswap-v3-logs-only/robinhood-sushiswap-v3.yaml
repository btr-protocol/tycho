specVersion: v0.1.0
package:
  name: "robinhood_sushiswap_v3"
  version: v0.2.0
  url: "https://github.com/propeller-heads/tycho-protocol-sdk/tree/main/substreams/ethereum-uniswap-v3-logs-only"

protobuf:
  files:
    - tycho/evm/v1/entity.proto
    - tycho/evm/v1/common.proto
    - tycho/evm/v1/utils.proto
    - uniswap.proto
  importPaths:
    - ./proto/v1
    - ../../../proto/
  excludePaths:
    - sf/ethereum
    - google

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/ethereum_uniswap_v3_logs_only.wasm

modules:
  - name: map_pools_created
    kind: map
    # First SushiSwap V3 PoolCreated event on Robinhood Chain.
    initialBlock: 6606213
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:tycho.evm.v1.BlockEntityChanges

  - name: store_pools
    kind: store
    initialBlock: 6606213
    updatePolicy: set_if_not_exists
    valueType: proto:uniswap.v3.Pool
    inputs:
      - map: map_pools_created

  - name: map_events
    kind: map
    initialBlock: 6606213
    inputs:
      - source: sf.ethereum.type.v2.Block
      - store: store_pools
    output:
      type: proto:uniswap.v3.Events

  - name: map_balance_changes
    kind: map
    initialBlock: 6606213
    inputs:
      - map: map_events
    output:
      type: proto:tycho.evm.v1.BlockBalanceDeltas

  - name: map_ticks_changes
    kind: map
    initialBlock: 6606213
    inputs:
      - map: map_events
    output:
      type: proto:uniswap.v3.TickDeltas

  - name: store_pool_current_tick
    kind: store
    initialBlock: 6606213
    updatePolicy: set
    valueType: int64
    inputs:
      - map: map_events

  - name: map_liquidity_changes
    kind: map
    initialBlock: 6606213
    inputs:
      - map: map_events
      - store: store_pool_current_tick
    output:
      type: proto:uniswap.v3.LiquidityChanges

  - name: map_protocol_changes
    kind: map
    initialBlock: 6606213
    inputs:
      - source: sf.ethereum.type.v2.Block
      - map: map_pools_created
      - map: map_events
      - map: map_balance_changes
      - map: map_ticks_changes
      - map: map_liquidity_changes
    output:
      type: proto:tycho.evm.v1.BlockChanges

params:
  map_pools_created: "factory_address=e51960f1b45f1c9fb6d166e6a884f866fc70433b&protocol_type_name=sushiswap_v3_pool"
