# information about the author helps us reach out in case of issues.
author:
  name: Paul de Renty
  email: paul@nxrates.com

# Protocol Constants
constants:
  # The expected average gas cost of a swap (the proxy has the LP manager post quotes first)
  protocol_gas: 600000
  # Minimum capabilities we can expect, individual pools may extend these
  capabilities:
    - SellSide

# The file containing the adapter contract
contract: HanjiSwapAdapter.sol

# Deployment instances used to generate chain specific bytecode.
instances:
  - chain:
      name: monad
      id: 143
